name: Build & Publish Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed Android APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM dependencies
        run: npm ci || npm install

      - name: Run Financial Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate Build Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/monetra-release.keystore
          else
            echo "Generating release keystore on CI..."
            keytool -genkeypair -v -keystore android/app/monetra-release.keystore \
              -alias monetra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass monetra123 -keypass monetra123 \
              -dname "CN=Monetra, OU=Mobile, O=Monetra, L=City, ST=State, C=IN"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/MONETRA-v3.0.0-release.apk

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MONETRA-v3.0.0-release-apk
          path: release-apk/MONETRA-v3.0.0-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: ${{ github.ref_name == 'main' && 'MONETRA V3 Latest Release' || github.ref_name }}
          body: |
            ## 🚀 MONETRA V3 - Institutional Personal Finance (Automated CI Build)
            
            This release was automatically built, tested, signed, and published by GitHub Actions.
            
            ### 📱 Installation
            Download `MONETRA-v3.0.0-release.apk` below and install it directly on your Android device.
            
            - **Paise Precision Engine**: 100% loss-free integer math.
            - **Local-First & Offline**: Complete privacy on-device.
            - **Multi-Theme Support**: Monochrome Neon Lime theme default.
          files: release-apk/MONETRA-v3.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
