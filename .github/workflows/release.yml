name: Build & Publish Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed Android APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM dependencies
        run: npm ci || npm install

      - name: Run Financial Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Permanent Release Keystore
        run: |
          echo "Restoring permanent release keystore for 1-click Android app updates..."
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/monetra-release.keystore
          else
            echo "" | base64 -d > android/app/monetra-release.keystore
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}"

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/MONETRA-v1.0.${{ github.run_number }}-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/MONETRA-latest-release.apk

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MONETRA-release-apk-b${{ github.run_number }}
          path: release-apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MONETRA V3 Build #${{ github.run_number }}
          body: |
            ## 🚀 MONETRA V3 - Institutional Personal Finance

            This release was automatically built, tested, signed, and published by GitHub Actions.

            ### 📱 Package & Compatibility Info
            - **Application ID**: `io.monetra.app`
            - **Build Number**: `${{ github.run_number }}`
            - **Signing Signature**: Consistent key signature (supports 1-click update over existing app).

            ### 📥 Download & Install
            Download `MONETRA-latest-release.apk` below and install or update directly on your Android device.
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
